<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>openGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#012439">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "black-translucent": the page runs under the clock like a normal app (21/11, his request). iOS 26 then sizes
     the viewport short by the status bar and leaves a band undrawn at the bottom (WebKit bug 301108): index.css
     makes the document screen-tall in standalone, which gets the full viewport back. If it ever does not,
     lib/viewport.js measures the band (--gap) and the tab bar sits on the lowest edge drawn.
     The installed icon remembers this setting: changing it needs the icon removed and re-added. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="openGym">
<!-- iOS paints the status strip from the first frame: after a reload on any screen it must already have that
     section's colour (stripOf() in components/Fondo.jsx) before React runs. -->
<script>
(function () {
  var h = location.hash, c = h.indexOf('#/allenamento') === 0 ? '#4a3100' : '#012439'
  document.documentElement.style.background = c
  document.documentElement.style.setProperty('--top', c)
  document.querySelector('meta[name="theme-color"]').setAttribute('content', c)
})()
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
